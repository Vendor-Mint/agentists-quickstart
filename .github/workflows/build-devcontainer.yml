name: Build and Push DevContainer

on:
  push:
    branches: [ "k8s-cloud-workspace-docker" ]
    paths:
      - '.devcontainer/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # Use the automatic GITHUB_TOKEN to authenticate
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-build and push DevContainer Image
        uses: devcontainers/ci@v0.3
        with:
          # Use the exact repository name within the organization
          imageName: ghcr.io/${{ github.repository }}
          cacheFrom: ghcr.io/${{ github.repository }}
          # Tag with 'latest' and the commit hash for versioning
          imageTag: latest,${{ github.sha }}
          push: always
